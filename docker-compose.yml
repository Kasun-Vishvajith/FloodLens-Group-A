services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: floodlens
      POSTGRES_USER: floodlens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U floodlens"]
      interval: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://floodlens:${POSTGRES_PASSWORD}@db:5432/floodlens
      FRONTEND_ORIGINS: http://localhost:8000,http://127.0.0.1:8000
    ports: ["127.0.0.1:8001:8001"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
