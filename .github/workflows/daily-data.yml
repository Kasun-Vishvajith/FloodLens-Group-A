name: Collect, validate and publish daily data
on:
  schedule:
    - cron: '35 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: floodlens-data
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: pip install -r requirements.txt
      - run: npm ci
      - name: Check numerical and refresh safeguards
        run: python -m unittest discover -s tests -p '*_test.py'
      - name: Collect into a staged release and validate
        run: python pipeline/update.py
      - name: Update report facts and build the website
        run: |
          python pipeline/report.py
          npm run build
          npm test
      - name: Persist successful data and provider snapshots
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/data docs/REPORT.md data/runs data/snapshots data/request-log.jsonl data/refresh-status.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish validated FloodLens archive and forecasts'
            git push
          fi
      - name: Redeploy Vercel from the persisted release
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo '::warning::Data saved. Add VERCEL_DEPLOY_HOOK to ensure automatic website deployment.'
          else
            curl --fail --silent --show-error --retry 2 --request POST "$VERCEL_DEPLOY_HOOK" > /dev/null
          fi
      - name: Retain execution evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: refresh-evidence
          path: |
            data/runs
            data/request-log.jsonl
            data/refresh-status.json
          retention-days: 30
